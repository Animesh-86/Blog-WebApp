{% extends 'blog/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-md border border-gray-200 bg-gradient-to-br from-blue-50 to-white">
  <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">🔐 Login to MySite</h2>

  <form method="POST" class="space-y-5">
    {% csrf_token %}

    {% if form.non_field_errors %}
      <div class="text-red-500 text-sm mb-2">
        {{ form.non_field_errors.0 }}
      </div>
    {% endif %}

    <div>
      <label class="block text-gray-700 font-medium mb-1">Username</label>
      <input type="text" name="username" placeholder="Enter your username"
        class="w-full border border-gray-300 px-4 py-2 rounded-md focus:ring-blue-500 focus:ring-2 focus:outline-none transition-all duration-200"
        required>
    </div>

    <div>
      <label class="block text-gray-700 font-medium mb-1">Password</label>
      <input type="password" name="password" placeholder="Enter your password"
        class="w-full border border-gray-300 px-4 py-2 rounded-md focus:ring-blue-500 focus:ring-2 focus:outline-none transition-all duration-200"
        required>
    </div>

    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-md shadow-md transition-all duration-200">
      Login
    </button>
  </form>

  <p class="mt-4 text-sm text-center text-gray-600">
    Don't have an account?
    <a href="{% url 'signup' %}" class="text-blue-600 hover:underline">Sign up here</a>
  </p>
</div>
{% endblock %}
