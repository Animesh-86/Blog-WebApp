{% extends 'blog/base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-md border border-gray-200 bg-gradient-to-br from-blue-50 to-white">
  <h2 class="text-3xl font-bold text-blue-700 mb-6 text-center">👤 Your Profile</h2>

  <div class="space-y-4 text-gray-800 text-base">
    <div class="flex justify-between border-b pb-2">
      <span class="font-medium text-gray-600">Full Name:</span>
      <span>{{ user.get_full_name }}</span>
    </div>
    <div class="flex justify-between border-b pb-2">
      <span class="font-medium text-gray-600">Username:</span>
      <span>{{ user.username }}</span>
    </div>
    <div class="flex justify-between border-b pb-2">
      <span class="font-medium text-gray-600">Email:</span>
      <span>{{ user.email }}</span>
    </div>
    <div class="flex justify-between">
      <span class="font-medium text-gray-600">Total Blogs:</span>
      <span>{{ datasets.count }}</span>
    </div>
  </div>

  <div class="mt-8 text-center">
    <a href="{% url 'home' %}" class="text-blue-600 hover:underline text-sm">← Back to Home</a>
  </div>
</div>

{% endblock %}
