{% extends 'blog/base.html' %}
{% block title %}{{ blog.name }}{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-xl shadow border border-gray-200 bg-gradient-to-br from-blue-50 to-white">
  <h2 class="text-3xl font-bold text-blue-800 mb-4">{{ blog.name }}</h2>
  <p class="text-gray-700 mb-4 whitespace-pre-line">{{ blog.description }}</p>
  <p class="text-sm text-gray-500">
    ✍️ Written by <strong>{{ blog.owner.get_full_name|default:blog.owner.username }}</strong> on {{ blog.created_at|date:"F j, Y" }}
  </p>

  <div class="mt-6 text-center">
    <a href="{% url 'home' %}" class="text-blue-600 hover:underline text-sm">← Back to Home</a>
  </div>
</div>

{% endblock %}
