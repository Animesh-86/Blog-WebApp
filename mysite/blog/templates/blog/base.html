<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MySite{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #f0f4ff, #ffffff);
      color: #1f2937;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Navbar -->
<nav class="bg-gradient-to-r from-blue-600 to-indigo-600 shadow-md">
  <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center">
    <a href="{% url 'home' %}" class="text-2xl font-bold text-white">MySite</a>

    <div class="flex items-center space-x-4 mt-2 sm:mt-0">
      <a href="{% url 'home' %}" class="text-white hover:text-gray-200 transition">Home</a>
      <a href="{% url 'about' %}" class="text-white hover:text-gray-200 transition">About</a>

      {% if request.user.is_authenticated %}
        <a href="{% url 'profile' %}" class="text-white hover:text-gray-200 transition">Profile</a>
        <span class="text-sm text-white bg-white/20 px-2 py-1 rounded">
          👤 {{ request.user.get_full_name }}
        </span>
        <a href="{% url 'logout' %}" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1 rounded transition">
          Logout
        </a>
      {% else %}
        <a href="{% url 'login' %}" class="bg-white hover:bg-gray-100 text-blue-700 px-3 py-1 rounded transition">
          Login
        </a>
        <a href="{% url 'signup' %}" class="border border-white hover:bg-white hover:text-blue-700 text-white px-3 py-1 rounded transition">
          Sign Up
        </a>
      {% endif %}
    </div>
  </div>
</nav>

<!-- Main content -->
<main class="flex-grow container mx-auto px-4 py-6">
  {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="text-center py-4 text-sm text-gray-500">
  © {{ now|date:"Y" }} MySite. All rights reserved.
</footer>

</body>
</html>
